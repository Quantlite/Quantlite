<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5eead4"/>
    </marker>
  </defs>

  <!-- connecting spine -->
  <line x1="115" y1="75" x2="785" y2="75" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Stage 1: PERCEPTION -->
  <g>
    <rect x="20" y="45" width="190" height="60" rx="8" fill="#0d1117" stroke="#5eead4" stroke-width="1.4"/>
    <text x="115" y="70" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">PERCEPTION</text>
    <text x="115" y="90" fill="#8b949e" font-size="10.5" text-anchor="middle">vision &#183; sensors &#183; SLAM</text>
  </g>

  <line x1="212" y1="75" x2="248" y2="75" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <!-- Stage 2: INTELLIGENCE -->
  <g>
    <rect x="250" y="45" width="190" height="60" rx="8" fill="#0d1117" stroke="#5eead4" stroke-width="1.4"/>
    <text x="345" y="70" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">INTELLIGENCE</text>
    <text x="345" y="90" fill="#8b949e" font-size="10.5" text-anchor="middle">ML &#183; deep learning &#183; CV</text>
  </g>

  <line x1="442" y1="75" x2="478" y2="75" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <!-- Stage 3: DECISION -->
  <g>
    <rect x="480" y="45" width="190" height="60" rx="8" fill="#0d1117" stroke="#5eead4" stroke-width="1.4"/>
    <text x="575" y="70" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">DECISION</text>
    <text x="575" y="90" fill="#8b949e" font-size="10.5" text-anchor="middle">planning &#183; reasoning &#183; control logic</text>
  </g>

  <line x1="672" y1="75" x2="708" y2="75" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <!-- Stage 4: ACTION -->
  <g>
    <rect x="710" y="45" width="170" height="60" rx="8" fill="#0d1117" stroke="#5eead4" stroke-width="1.4"/>
    <text x="795" y="70" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">ACTION</text>
    <text x="795" y="90" fill="#8b949e" font-size="10.5" text-anchor="middle">ROS 2 &#183; robotics &#183; real-world</text>
  </g>
</svg>
